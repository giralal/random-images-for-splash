<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Random Image</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; background-color: #000; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <img id="rotator" src="" alt="Loading Random Image...">

    <script>
        // Array of your images
        const imageFiles = [
            "bluehour.jpg",
            "cat-vibin.png",
            "dark-forest.jpg",
            "dark-waves.jpg",
            "dominik-mayer-25.jpg",
            "eclipse.jpg",
            "flying-comets-clouds.jpg",
            "girl-stars.png",
            "Haunted-house.jpg",
            "horizon-2.jpg",
            "horizon.jpg",
            "idk-tbh.png",
            "kaiju.png",
            "lit-up-sky.png",
            "main-street.png",
            "minimalist-black-hole.png",
            "mountain-range.jpg",
            "mushishi.jpg",
            "pixel-castle.png",
            "pixel-reading.png",
            "railroad-cat.png",
            "rainy-window.jpeg",
            "sakura-aura.jpg",
            "samurai.jpg",
            "shadow-shape-holo.jpeg",
            "snowflakes.jpg",
            "sword.jpg",
            "train-sideview.png",
            "van-chilling.png",
            "venice-market.png",
            "vibrant-gate.png"
        ];

        // This uses local relative paths instead of raw.githubusercontent links
        const baseFolder = "./src/";

        if (imageFiles.length > 0) {
            const randomIndex = Math.floor(Math.random() * imageFiles.length);
            const chosenImage = imageFiles[randomIndex];

            // Renders via internal host directories directly 
            document.getElementById('rotator').src = baseFolder + chosenImage;
        } else {
            console.error("The imageFiles array is empty.");
        }
    </script>
</body>
</html>
