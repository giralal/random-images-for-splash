<!DOCTYPE html>
<html>
<head>
    <title>Random Image Rotator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; background-color: #000; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <img id="rotator" src="" alt="Randomized Content">

    <script>
        // Paste your direct image URLs between the quotation marks inside this array
        const images = [
            "https://unsplash.com",
            "https://unsplash.com",
            "https://unsplash.com"
        ];

        const randomImage = images[Math.floor(Math.random() * images.length)];
        
       
        document.getElementById('rotator').src = randomImage;
    </script>
</body>
</html>
